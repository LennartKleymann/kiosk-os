name: Build ISO

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installer API tests
        run: python3 tests/test_installer_api.py

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build ISO
        run: nix build .#iso -L

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp -L result/iso/kiosk-os.iso dist/
          cd dist
          sha256sum kiosk-os.iso > kiosk-os.iso.sha256
          cat kiosk-os.iso.sha256
          ls -lh kiosk-os.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v5
        with:
          name: kiosk-os-iso
          path: dist/
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            dist/kiosk-os.iso
            dist/kiosk-os.iso.sha256
          generate_release_notes: true
