name: Build ISO

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer API tests
        run: python3 tests/test_installer_api.py

      # Runs against a synthetic image so a mistake here surfaces in seconds
      # rather than after an 8-minute ISO build.
      - name: Config partition tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dosfstools mtools jq
          bash tests/test_config_partition.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Wizard tests
        run: dotnet test wizard/KioskOsWizard.Tests --nologo

  wizard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runtime: win-x64
            artifact: kiosk-os-wizard-windows
          - runtime: linux-x64
            artifact: kiosk-os-wizard-linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish wizard
        run: |
          dotnet publish wizard/KioskOsWizard \
            -c Release \
            -r ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/${{ matrix.runtime }}

      - name: Upload wizard
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.runtime }}/
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: publish/${{ matrix.runtime }}/KioskOsWizard*

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build ISO
        run: nix build .#iso -L

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp -L result/iso/kiosk-os.iso dist/
          cd dist
          sha256sum kiosk-os.iso > kiosk-os.iso.sha256
          cat kiosk-os.iso.sha256
          ls -lh kiosk-os.iso

      # Ties the image cryptographically to this commit and this workflow, so
      # anyone can check where it came from without having to trust us:
      #   gh attestation verify kiosk-os.iso --repo LennartKleymann/kiosk-os
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/kiosk-os.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: kiosk-os-iso
          path: dist/
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: |
            dist/kiosk-os.iso
            dist/kiosk-os.iso.sha256
          generate_release_notes: true
